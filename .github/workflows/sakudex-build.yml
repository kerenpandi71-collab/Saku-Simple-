name: Saku DeX Android Build

on:
  push:
    branches:
      - feature/saku-dex-stage-1
    paths:
      - "sakudex/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/sakudex-build.yml"
  pull_request:
    branches:
      - feature/saku-dex-stage-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Saku DeX debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        run: gradle --no-daemon :sakudex:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuDeX-stage-1-debug
          path: sakudex/build/outputs/apk/debug/sakudex-debug.apk
          if-no-files-found: error
          retention-days: 14
