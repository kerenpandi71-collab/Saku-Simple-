name: Android Build

on:
  push:
    branches: [main, feature/virtual-display-touch-control]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build both debug APKs
        run: gradle --no-daemon assembleSakuSimpleDebug assembleVirtualDisplayTouchDebug
      - name: Upload Saku Simple APK
        uses: actions/upload-artifact@v4
        with:
          name: saku-simple-debug-apk
          path: app/build/outputs/apk/sakuSimple/debug/*.apk
          if-no-files-found: error
      - name: Upload Virtual Display Touch APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-display-touch-debug-apk
          path: app/build/outputs/apk/virtualDisplayTouch/debug/*.apk
          if-no-files-found: error
