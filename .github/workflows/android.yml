name: Standalone Gamepad Build

on:
  push:
    branches: [feature/standalone-gamepad-only]
  pull_request:
    branches: [feature/standalone-gamepad-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/saku-gamepad-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Build Standalone Gamepad APK
        run: gradle --no-daemon assembleStandaloneGamepadDebug
      - name: Upload Standalone Gamepad APK
        uses: actions/upload-artifact@v4
        with:
          name: standalone-gamepad-debug-apk
          path: app/build/outputs/apk/standaloneGamepad/debug/*.apk
          if-no-files-found: error
